<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마스토돈 아카이브 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<style id="mav-css">
/* Layout: Mastodon web 3-column — left (search, filters, stats) · center 600px timeline column · right navigation */
:root{
  --bg:#eff3f5; --col:#ffffff; --col-hover:#f5f7fa; --line:#dde3ea; --text:#0f1115;
  --muted:#606984; --link:#563acc; --brand:#6364ff; --brand-hover:#5354e0; --on-brand:#ffffff;
  --chip:#e6eaf2; --overlay:rgba(10,12,20,.86); --bar:#d7dcf5; --bar-lead:#b9bdfa;
  --warn:#b35a00;
  --font:'Roboto','Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191b22; --col:#282c37; --col-hover:#2f3441; --line:#393f4f; --text:#ffffff;
  --muted:#9baec8; --link:#8c8dff; --brand:#6364ff; --brand-hover:#7778ff; --on-brand:#ffffff;
  --chip:#393f4f; --overlay:rgba(0,0,0,.88); --bar:#3c4161; --bar-lead:#5458a8; --warn:#f0a63a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191b22; --col:#282c37; --col-hover:#2f3441; --line:#393f4f; --text:#ffffff;
  --muted:#9baec8; --link:#8c8dff; --brand:#6364ff; --brand-hover:#7778ff; --on-brand:#ffffff;
  --chip:#393f4f; --overlay:rgba(0,0,0,.88); --bar:#3c4161; --bar-lead:#5458a8; --warn:#f0a63a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
img{max-width:100%}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}

.layout{display:grid;grid-template-columns:285px minmax(0,600px) 285px;gap:12px;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;align-items:start}
.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.panel{background:var(--col);border-radius:8px;padding:14px}
.panel h3{margin:0 0 10px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 2px}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}

.search{position:relative}
.search input{width:100%;background:var(--col);border:1px solid var(--line);border-radius:6px;padding:10px 12px 10px 38px;outline:none}
.search input:focus{border-color:var(--brand)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}

.drop{border:2px dashed var(--line);border-radius:8px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--brand);background:var(--col-hover)}
.drop p{margin:0;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:6px;padding:9px 16px;font-weight:500;cursor:pointer;background:var(--brand);color:var(--on-brand);font-size:14px}
.btn:hover{background:var(--brand-hover);text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--col-hover)}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.small{font-size:12px;color:var(--muted);margin:0}
.err{color:var(--warn);font-size:13px;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip .ic{width:15px;height:15px}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.8}
.tagchip{background:var(--chip);border:0;border-radius:4px;padding:3px 8px;font-size:13px;cursor:pointer;color:var(--text)}
.tagchip:hover{background:var(--brand);color:var(--on-brand)}
.tagchip b{font-weight:500;color:var(--muted);margin-left:4px}
.tagchip:hover b{color:inherit}
.row{display:flex;gap:8px;align-items:center}
.row select{flex:1;min-width:0;background:var(--col);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats div{min-width:0}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.stats dd.date{font-size:13px;font-weight:500}
.years{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.years button{display:grid;grid-template-columns:42px 1fr 44px;align-items:center;gap:8px;background:none;border:0;padding:2px 0;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;text-align:left}
.years .track{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.years .fill{height:100%;background:var(--brand);border-radius:4px}
.years button[aria-pressed="true"] span:first-child{color:var(--link);font-weight:700}
.years button span:last-child{text-align:right;color:var(--muted)}

/* center column */
.column{background:var(--col);border-radius:8px;min-width:0;overflow:clip}
.col-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--col);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;font-weight:500;font-size:16px}
.col-head button{background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--link);padding:6px 0;font-weight:500}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--chip);font-size:13px;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:180px}

.account-header .hdr{aspect-ratio:3/1;background:var(--chip) center/cover no-repeat;max-width:100%}
.ah-bar{display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;margin-top:-44px}
.ah-avatar{width:94px;height:94px;border-radius:12px;border:4px solid var(--col);background:var(--chip);object-fit:cover;display:block}
.ah-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ah-names h1{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.acct{color:var(--muted);font-size:15px;word-break:break-all}
.ah-bio{overflow-wrap:anywhere}
.ah-bio p{margin:0 0 8px}.ah-bio p:last-child{margin:0}
.fields{border:1px solid var(--line);border-radius:6px;margin:0;overflow:hidden}
.fields div{display:grid;grid-template-columns:minmax(80px,30%) 1fr;border-top:1px solid var(--line);font-size:14px}
.fields div:first-child{border-top:0}
.fields dt{padding:9px 12px;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.fields dd{margin:0;padding:9px 12px;overflow-wrap:anywhere}
.ah-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.ah-meta b{color:var(--text);font-variant-numeric:tabular-nums}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a{flex:1 0 auto;text-align:center;padding:14px 12px;color:var(--muted);font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{text-decoration:none;color:var(--text);background:var(--col-hover)}
.tabs a[aria-current="page"]{color:var(--link);border-bottom-color:var(--brand)}
.filter-note{padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}

/* status */
.status{position:relative;padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;cursor:pointer}
.status:hover{background:var(--col-hover)}
.status.focused{cursor:default;background:var(--col);scroll-margin-top:60px}
.status.has-next::before{content:"";position:absolute;left:38px;top:66px;bottom:0;width:2px;background:var(--line)}
.status.has-prev::after{content:"";position:absolute;left:38px;top:0;height:16px;width:2px;background:var(--line)}
.status.has-next > :not(.st-head),.status.has-prev:not(.focused) > :not(.st-head){margin-left:58px}
.thread-btn{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--link);font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.thread-btn .ic{width:17px;height:17px}
.thread-btn:hover{text-decoration:underline}
.thread-block .status.has-next,#detail-view .status.has-next{border-bottom:0}
.thread-fold{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.status[data-foreign]{cursor:default}
details summary{list-style-position:inside}
.prepend{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:500;padding-left:20px}
.prepend .ic{width:17px;height:17px}
.st-head{display:flex;gap:12px;align-items:flex-start;min-width:0}
.st-avatar{width:46px;height:46px;border-radius:8px;background:var(--chip);flex:none;object-fit:cover;position:relative;z-index:1}
.st-names{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;padding-top:3px}
.st-names .dn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-names .acct{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-time{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;white-space:nowrap;padding-top:3px}
.st-time a{color:inherit}
.st-time .ic{width:16px;height:16px}
.reply-to{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.reply-to .ic{width:15px;height:15px}
.reply-to a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.content{overflow-wrap:anywhere;font-size:15px}
.focused .content{font-size:19px;line-height:1.4}
.content p{margin:0 0 .9em}.content p:last-child{margin-bottom:0}
.content .invisible{font-size:0;line-height:0;display:inline-block;width:0;height:0;position:absolute}
.content .ellipsis::after{content:"…"}
.content blockquote{margin:0 0 .9em;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.content pre{white-space:pre-wrap;background:var(--chip);padding:8px;border-radius:4px}
.content code{background:var(--chip);padding:0 4px;border-radius:3px;font-size:.92em}
.content a.mention,.content a.hashtag{color:var(--link)}
.custom-emoji{height:1.4em;width:auto;vertical-align:middle;margin:-.2ex 0 .2ex;object-fit:contain}
.cw{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cw p{margin:0;font-weight:500}
.cw-btn{background:var(--chip);border:0;border-radius:4px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.cw-btn:hover{background:var(--brand);color:var(--on-brand)}

.gallery{display:grid;gap:2px;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%;position:relative;background:var(--chip)}
.gallery.n1{grid-template-columns:1fr}
.gallery.n2{grid-template-columns:1fr 1fr}
.gallery.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.gallery.n3 .gi:first-child{grid-row:span 2}
.gallery.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.gi{position:relative;min-width:0;min-height:0;background:var(--chip);border:0;padding:0;cursor:zoom-in;overflow:hidden}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;display:block}
.gi .badge{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;letter-spacing:.04em}
.gi .play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.gallery.blur .gi img,.gallery.blur .gi video{filter:blur(28px) saturate(.7);transform:scale(1.2)}
.sens{position:absolute;inset:0;margin:auto;height:fit-content;width:fit-content;z-index:2;border:0;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;padding:10px 16px;cursor:pointer;font-weight:500;text-align:center;line-height:1.35}
.sens small{display:block;font-weight:400;opacity:.8}
.audio-att{width:100%}
.file-att{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px}

.poll{display:flex;flex-direction:column;gap:6px}
.poll-opt{position:relative;border-radius:4px;overflow:hidden;padding:7px 10px;display:flex;gap:10px;font-size:14px;align-items:center;min-height:34px}
.poll-opt .fill{position:absolute;inset:0 auto 0 0;background:var(--bar);border-radius:4px}
.poll-opt.lead .fill{background:var(--bar-lead)}
.poll-opt span{position:relative}
.poll-opt .pct{font-weight:700;min-width:42px;font-variant-numeric:tabular-nums}
.poll-foot{font-size:13px;color:var(--muted)}

.boost-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.boost-card .bi{width:40px;height:40px;border-radius:8px;background:var(--chip);display:grid;place-items:center;color:var(--muted);flex:none}
.boost-card div{min-width:0}
.boost-card a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.boost-card p{margin:2px 0 0;font-size:13px;color:var(--muted)}

.actions{display:flex;justify-content:space-between;max-width:420px;color:var(--muted)}
.actions span{display:inline-flex;align-items:center;gap:6px;padding:4px;font-size:13px;opacity:.75}
.actions .off{opacity:.3}
.focus-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.focus-meta .ic{width:16px;height:16px}

.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.media-grid .gi{aspect-ratio:1}
.linkcard{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);min-width:0}
.linkcard:hover{background:var(--col-hover);text-decoration:none}
.linkcard .bi{width:40px;height:40px;border-radius:8px;background:var(--chip);display:grid;place-items:center;color:var(--muted);flex:none}
.linkcard div{min-width:0}
.linkcard b{display:block;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkcard span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loadmore{padding:20px;text-align:center;color:var(--muted);font-size:13px}

/* right nav */
.nav{display:flex;flex-direction:column;background:transparent;padding:0}
.nav a,.nav button{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:8px;color:var(--text);font-size:16px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--col);text-decoration:none}
.nav a[aria-current="page"]{font-weight:700;color:var(--link)}
.nav .ic{width:22px;height:22px}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 14px}
.nav .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* overlays */
.drop-ov{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:500;pointer-events:none}
.drop-ov div{border:3px dashed rgba(255,255,255,.6);border-radius:16px;padding:40px 48px}
.lightbox{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lb-cap{color:#fff;font-size:14px;max-width:640px;text-align:center;max-height:6em;overflow:auto}
.lb-cap a{color:#c8c9ff}
.lb-btn{position:absolute;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.lb-close{top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.lb-prev{left:max(16px,env(safe-area-inset-left,0px));top:50%}
.lb-next{right:max(16px,env(safe-area-inset-right,0px));top:50%}
.modal{position:fixed;inset:0;z-index:45;background:var(--overlay);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--col);border-radius:12px;padding:20px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal-card h2{margin:0;font-size:18px}
.modal-card p{margin:0;font-size:14px;color:var(--muted)}
.modal-card fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0;display:flex;flex-direction:column;gap:8px}
.modal-card legend{font-size:13px;font-weight:500;padding:0 4px}
.modal-card label{display:flex;gap:8px;align-items:center;font-size:14px}
.modal-card .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.note{background:var(--chip);border-radius:6px;padding:10px 12px;font-size:13px!important}
.progress{font-size:13px;color:var(--link);min-height:1.2em}

.panel-btn{margin-left:auto;background:none;border:0;border-radius:6px;padding:6px!important;color:var(--muted)!important;cursor:pointer;display:inline-flex}
.panel-btn:hover{background:var(--col-hover);color:var(--text)!important}
.panel-btn[aria-pressed="true"]{color:var(--link)!important}
@media (min-width:841px){
  body.left-hidden .side-left{display:none}
  body.left-hidden .layout{grid-template-columns:minmax(0,600px) 285px}
}
@media (min-width:841px) and (max-width:1180px){
  body.left-hidden .layout{grid-template-columns:minmax(0,600px)}
}
.modal-card.help{width:min(680px,100%);gap:0;padding:0}
.help-head{position:sticky;top:0;background:var(--col);display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);z-index:1}
.help-body{padding:4px 20px 20px;font-size:14px;line-height:1.6}
.help-body h3{font-size:16px;margin:22px 0 8px}
.help-body section{scroll-margin-top:60px}
.help-body p{margin:0 0 8px;color:var(--text)}
.help-body ol,.help-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.help-body code{background:var(--chip);padding:1px 5px;border-radius:3px;font-size:.92em;overflow-wrap:anywhere}
.help-body .note{margin-top:10px;color:var(--muted)}
.help-toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.help-toc a{background:var(--chip);color:var(--text);border-radius:99px;padding:4px 10px;font-size:13px}
.help-toc a:hover{background:var(--brand);color:var(--on-brand);text-decoration:none}
.topbar{display:none}
.side-toggle{display:none}

@media (max-width:1180px){
  .layout{grid-template-columns:285px minmax(0,600px)}
  .side-right{display:none}
}
@media (max-width:840px){
  .layout{grid-template-columns:minmax(0,1fr);padding-block:12px;gap:10px}
  .side{position:static;max-height:none;overflow:visible}
  .side-left > .brand{display:none}
  .side-left.collapsed .collapsible{display:none}

<section id="h-get"><h3>1. 아카이브 받기</h3>
<ol><li>마스토돈 웹에서 <b>환경설정 → 가져오기 및 내보내기 → 데이터 내보내기</b>로 가요.</li>
<li><b>아카이브 요청</b>을 누르면 준비가 끝났을 때 메일로 알려줘요. 글이 많으면 몇 시간 걸리기도 해요.</li>
<li>같은 화면에서 zip 파일(예전 서버는 .tar.gz)을 내려받아요. 아카이브는 7일에 한 번만 요청할 수 있어요.</li></ol></section>
<section id="h-open"><h3>2. 열어 보기</h3>
<ul><li>받은 파일을 이 화면 아무 곳에나 끌어다 놓거나 <b>파일 선택</b>으로 골라요.</li>
<li>압축을 이미 풀었다면 <b>압축을 푼 폴더 선택하기</b>로 폴더째 열 수 있어요.</li>
<li>파일은 이 브라우저 안에서만 읽어요. 어디에도 업로드되지 않아요.</li></ul></section>
<section id="h-view"><h3>3. 화면 보는 법</h3>
<ul><li><b>게시물 / 게시물과 답글 / 미디어 / 좋아요 / 북마크</b> 탭으로 나눠 볼 수 있어요.</li>
<li>이어 쓴 글은 첫 글 하나로 묶여요. <b>타래 이어보기</b>를 누르면 그 자리에서 펼쳐지고, <b>타래 접기</b>로 다시 접어요. 하나씩 보고 싶으면 <b>이어 쓴 타래 하나로 묶기</b>를 끄세요.</li>
<li>게시물을 누르면 앞뒤 대화가 이어진 상세 화면이 열려요.</li>
<li>왼쪽 패널에서 검색, 공개 범위, 정렬, 연도, 해시태그로 거를 수 있어요. 가운데 칼럼 오른쪽 위 아이콘으로 왼쪽 패널을 숨길 수 있어요.</li>
<li>좋아요·북마크·부스트는 아카이브에 원래 글 주소만 저장돼서 링크로 보여줘요.</li></ul></section>
<section id="h-others"><h3>4. 다른 사람 글 함께 백업</h3>
<p>아카이브에는 내 글만 들어 있어요. 내 글에 달린 남의 답글이나 내가 답한 원래 글은 내 인스턴스 서버에 물어서 가져와요.</p>
<ul><li>인스턴스와 내 계정이 아직 살아 있어야 해요.</li>
<li>왼쪽 <b>다른 사람 글 함께 백업</b>에서 범위를 고르고 <b>대화 불러오기 시작</b>을 눌러요. 게시물 하나만 받으려면 글을 열고 <b>다른 사람 글까지 불러오기</b>를 누르세요.</li>
<li>서버 요청 한도 때문에 글 하나에 1초쯤 걸려요. 답글 500개면 10분 정도예요. 중간에 <b>멈추기</b>를 눌러도 그때까지 받은 글은 남아요.</li>
<li><b>팔로워 전용·개인적인 멘션 글</b>의 대화는 액세스 토큰이 있어야 받을 수 있어요. 아래 5번을 보세요.</li>
<li>내 서버에 전달되지 않은 다른 서버의 답글은 빠질 수 있어요.</li>
<li>불러온 글은 페이지를 닫으면 사라져요. 다 받으면 바로 내보내기를 하세요.</li></ul></section>
<section id="h-token"><h3>5. 액세스 토큰 만들기</h3>
<ol><li>마스토돈 웹에서 <b>환경설정 → 개발 → 새 애플리케이션</b>을 눌러요. 주소창에 <code>https://내인스턴스/settings/applications/new</code>를 넣어도 돼요.</li>
<li><b>애플리케이션 이름</b>: 아무거나 괜찮아요. 예: <code>아카이브 백업</code></li>
<li><b>애플리케이션 웹사이트</b>: 비워 두세요. 꼭 넣어야 하면 내 프로필 주소를 넣으면 돼요.</li>
<li><b>리다이렉트 URI</b>: 기본값 <code>urn:ietf:wg:oauth:2.0:oob</code>를 그대로 두세요. 비어 있으면 이 값을 넣으세요. 이 방식에서는 리다이렉트를 쓰지 않아요.</li>
<li><b>범위(권한)</b>: 체크된 것을 모두 해제하고 <code>read:statuses</code> 하나만 체크하세요. 목록에 없으면 <code>read</code>를 체크해요. 읽기 권한만 있어서 토큰이 새어 나가도 글을 쓰거나 지울 수 없어요.</li>
<li><b>제출</b>을 누르고, 목록에 생긴 앱 이름을 눌러 들어가요.</li>
<li><b>액세스 토큰</b> 값만 복사해서 왼쪽 <b>비공개 글도 불러오기 (액세스 토큰)</b> 칸에 붙여 넣어요. 클라이언트 키와 비밀키는 필요 없어요.</li>
<li>백업이 끝나면 같은 화면에서 그 앱을 <b>삭제</b>하세요. 토큰도 함께 무효가 돼요.</li></ol>
<p class="note">토큰은 비밀번호처럼 다뤄 주세요. 이 페이지는 토큰을 저장하지 않고, 내 인스턴스에 보내는 요청에만 써요. 다른 사람에게 보여주거나 채팅에 붙여 넣지 마세요.</p></section>
<section id="h-export"><h3>6. HTML로 내보내기</h3>
<ul><li><b>HTML로 내보내기</b>에서 포함할 공개 범위를 고르고 <b>zip 만들기</b>를 눌러요.</li>
<li>zip을 풀고 <b>index.html</b>을 열면 인터넷 없이도 볼 수 있어요. 폴더째 웹 호스팅(GitHub Pages 등)에 올려도 돼요.</li>
<li><b>index.html만 받기</b>는 미디어를 빼고 페이지만 저장해요. 압축을 푼 아카이브 폴더 안에 넣으면 사진도 같이 보여요.</li>
<li>불러온 다른 사람 글과 그 사람들의 프로필 사진·이미지도 함께 담을 수 있어요. 서버가 막은 이미지는 원래 주소로 남아요.</li>
<li>공개 사이트로 올릴 때는 팔로워 전용·개인적인 멘션을 빼는 걸 권해요.</li>
<li>내보낸 사이트에는 아카이브 열기, 대화 불러오기, 이 설명서가 들어가지 않아요.</li></ul></section>
<section id="h-trouble"><h3>7. 잘 안 될 때</h3>
<ul><li>이 파일을 Claude 미리보기 화면에서 열면 파일 저장과 서버 접속이 막혀요. 받은 HTML 파일을 내 컴퓨터 브라우저로 여세요.</li>
<li>.tar.gz가 열리지 않으면 최신 Chrome·Firefox·Safari를 쓰거나, 압축을 풀어서 폴더로 여세요.</li>
<li>다른 사람 글 불러오기가 안 되면 왼쪽의 <b>문제 진단</b>을 눌러 보세요. 서버 연결, 글 찾기, 대화 불러오기를 차례로 점검해 줘요.</li></ul></section>

  const buf = gz ? await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer() : await file.arrayBuffer();
  return makeVFS(parseTar(buf).map(([n,d]) => [n, () => Promise.resolve(new Blob([d], {type:mimeOf(n)}))]));
}
function vfsFromFiles(list){
  return makeVFS([...list].map(f => [(f.webkitRelativePath || f.name), () => Promise.resolve(f)]));
}

/* ---------- normalize ActivityPub export ---------- */
const arr = v => v == null ? [] : Array.isArray(v) ? v : [v];
function mediaPath(u){
  if (!u) return null;
  if (/^data:/.test(u)) return u;
  u = String(u).split('?')[0];
  const i = u.indexOf('media_attachments/');
  if (i >= 0) return u.slice(i);
  if (/^https?:/i.test(u)) return u;
  return u.replace(/^\/+/, '');
}
function visibilityOf(a){
  const to = arr(a.to), cc = arr(a.cc);
  if (to.some(x => PUBLIC.includes(x))) return 'public';
  if (cc.some(x => PUBLIC.includes(x))) return 'unlisted';
  if (to.some(x => /\/followers$/.test(x))) return 'private';
  return 'direct';
}
const idFrom = (u, fb) => { const m = String(u||'').match(/statuses\/([^/?#]+)/); return m ? m[1] : String(fb); };
function emojiMap(tags){
  const m = {};
  for (const t of arr(tags)) if (t && t.type === 'Emoji' && t.name && t.icon) m[t.name] = mediaPath(t.icon.url || t.icon);
  return m;
}
function normalize(actorJson, outbox, likesJson, bookmarksJson){
  const items = arr(outbox && outbox.orderedItems);
  const a = actorJson || {};
  const actorId = a.id || (items[0] && items[0].actor) || '';
  let host = ''; try { host = new URL(actorId).host; } catch(e){}
  const actor = {
    id: actorId, name: a.name || a.preferredUsername || '내 계정', username: a.preferredUsername || '',
    handle: a.preferredUsername ? `@${a.preferredUsername}${host ? '@' + host : ''}` : '',
    summary: a.summary || '', avatar: mediaPath(a.icon && (a.icon.url || a.icon)), header: mediaPath(a.image && (a.image.url || a.image)),
    fields: arr(a.attachment).filter(f => f && f.type === 'PropertyValue').map(f => ({name:f.name || '', value:f.value || ''})),
    published: a.published || null, url: a.url || actorId, emojis: emojiMap(a.tag)
  };
  const statuses = [];
  items.forEach((it, i) => {
    if (!it) return;
    if (it.type === 'Announce'){
      const target = typeof it.object === 'string' ? it.object : (it.object && (it.object.id || it.object.url)) || '';
      statuses.push({id: idFrom(it.id, 'b' + i), kind:'boost', published: it.published, boostOf: target, visibility: visibilityOf(it), tags:[], attachments:[]});
      return;
    }
    if (it.type !== 'Create' || !it.object || typeof it.object !== 'object') return;
    const o = it.object;
    const content = o.content || Object.values(o.contentMap || {})[0] || '';
    const tags = arr(o.tag).filter(t => t && t.type === 'Hashtag' && t.name).map(t => t.name.replace(/^#/, '').toLowerCase());
    const attachments = arr(o.attachment).filter(Boolean).map(x => {
      const mt = x.mediaType || mimeOf(String(x.url || ''));
      return {type: mt.startsWith('image/') ? 'image' : mt.startsWith('video/') ? 'video' : mt.startsWith('audio/') ? 'audio' : 'other',
        path: mediaPath(x.url && (x.url.href || x.url)), alt: x.name || '', w: x.width || 0, h: x.height || 0, mime: mt};
    }).filter(x => x.path);
    let poll = null;
    if (o.type === 'Question' && (o.oneOf || o.anyOf)){
      const opts = arr(o.oneOf || o.anyOf).map(x => ({name: x.name || '', count: (x.replies && x.replies.totalItems) || 0}));
      const sum = opts.reduce((s,x) => s + x.count, 0);
      poll = {options: opts, multiple: !!o.anyOf, voters: o.votersCount || sum, total: sum, endTime: o.endTime || o.closed || null, closed: !!o.closed || (o.endTime && new Date(o.endTime) < new Date())};
    }
    statuses.push({
      id: idFrom(o.id, 'n' + i), uri: o.id || '', kind:'post', url: (o.url && (o.url.href || o.url)) || o.id || '', published: o.published || it.published,
      content, summary: o.summary || '', sensitive: !!o.sensitive, visibility: visibilityOf(o.to ? o : it),
      inReplyTo: (o.inReplyTo && (o.inReplyTo.id || o.inReplyTo)) || null, tags, attachments, poll, emojis: emojiMap(o.tag),
      lang: Object.keys(o.contentMap || {})[0] || ''
    });
  });
  const byRef = new Map(), norm = u => String(u || '').replace(/[?#].*$/, '').replace(/\/+$/, '');
  for (const s of statuses) if (s.kind === 'post'){ if (s.uri) byRef.set(norm(s.uri), s.id); if (s.url) byRef.set(norm(s.url), s.id); }
  for (const s of statuses){
    if (s.inReplyTo){ const r = byRef.get(norm(s.inReplyTo)); if (r && r !== s.id) s.inReplyToId = r; }
  }
  const urlList = j => arr(j && j.orderedItems).map(x => typeof x === 'string' ? x : (x && (x.id || x.url))).filter(Boolean);
  return {actor, statuses, likes: urlList(likesJson).reverse(), bookmarks: urlList(bookmarksJson).reverse()};
}

/* ---------- sanitize post HTML ---------- */
const ALLOWED = new Set(['P','BR','A','SPAN','STRONG','EM','B','I','U','DEL','S','CODE','PRE','BLOCKQUOTE','UL','OL','LI','SUB','SUP','H1','H2','H3','H4','H5','H6']);
const KEEP_CLASS = /^(invisible|ellipsis|mention|hashtag|h-card|u-url)$/;
function sanitize(html, emojis){
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const root = doc.body.firstChild;
  (function walk(node){
    for (const el of [...node.children]){
      if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|FORM|INPUT|TEMPLATE)$/.test(el.tagName)){ el.remove(); continue; }
      walk(el);
      if (!ALLOWED.has(el.tagName)){ el.replaceWith(...el.childNodes); continue; }
      for (const at of [...el.attributes]){
        const n = at.name.toLowerCase();
        if (n === 'href' && el.tagName === 'A' && /^https?:/i.test(at.value)) continue;
        if (n === 'class'){ const c = at.value.split(/\s+/).filter(x => KEEP_CLASS.test(x)).join(' '); if (c){ el.setAttribute('class', c); continue; } }
        el.removeAttribute(at.name);
      }
      if (el.tagName === 'A'){ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer'); }
    }
  })(root);
  if (emojis && Object.keys(emojis).length){
    const tw = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT); const texts = [];
    while (tw.nextNode()) texts.push(tw.currentNode);
    for (const t of texts){
      if (!/:[\w+-]+:/.test(t.data)) continue;
      const frag = doc.createDocumentFragment();
      t.data.split(/(:[\w+-]+:)/).forEach(part => {
        if (emojis[part]){ const img = doc.createElement('img'); img.className = 'custom-emoji'; img.alt = part; img.title = part; img.setAttribute('data-media', emojis[part]); frag.append(img); }
        else if (part) frag.append(doc.createTextNode(part));
      });
      t.replaceWith(frag);
    }
  }
  return root.innerHTML;
}
const plain = html => { const d = new DOMParser().parseFromString('<div>' + (html||'') + '</div>', 'text/html'); return d.body.textContent || ''; };

/* ---------- media resolution ---------- */
let VFS = null;
function resolveMedia(p){
  if (!p) return Promise.resolve('');
  if (/^(data:|blob:|https?:)/i.test(p)) return Promise.resolve(p);
  if (EMBED) return Promise.resolve(p.split('/').map(encodeURIComponent).join('/'));
  return VFS ? VFS.url(p) : Promise.resolve('');
}
function hydrate(root){
  root.querySelectorAll('[data-media]').forEach(el => {
    const p = el.getAttribute('data-media'); el.removeAttribute('data-media');
    resolveMedia(p).then(u => { if (u) el.src = u; else if (el.tagName === 'IMG') el.style.visibility = 'hidden'; });
  });
  root.querySelectorAll('[data-media-bg]').forEach(el => {
    const p = el.getAttribute('data-media-bg'); el.removeAttribute('data-media-bg');
    resolveMedia(p).then(u => { if (u) el.style.backgroundImage = `url("${u}")`; });
  });
}

const S = {
  data:null, byId:new Map(), children:new Map(), stats:null,
  tab:'posts', q:'', tag:null, year:null, sort:'new',
  vis:{public:true, unlisted:true, private:true, direct:false},
  list:[], shown:0, listScroll:0, sideCollapsed:true, group:true, convOf:new Map()
};
const TABS = [
  {id:'posts', label:'게시물', icon:'posts'}, {id:'replies', label:'게시물과 답글', icon:'replies'},
  {id:'media', label:'미디어', icon:'media'}, {id:'likes', label:'좋아요', icon:'star'}, {id:'bookmarks', label:'북마크', icon:'bookmark'}

function setData(d){
  S.data = d; S.byId = new Map(); S.children = new Map(); S.convOf = new Map();
  d.others = d.others || {}; d.convos = d.convos || [];
  S.byUri = new Map(); S.apiId = S.apiId || new Map();
  for (const x of d.statuses){ if (x.uri) S.byUri.set(String(x.uri).replace(/\/+$/, ''), x.id); if (x.url) S.byUri.set(String(x.url).replace(/\/+$/, ''), x.id); }
  for (const c of d.convos) for (const x of c.order) S.convOf.set(x, c);
  for (const o of Object.values(d.others)) o._t = +new Date(o.published) || 0;
  for (const s of d.statuses){
    S.byId.set(s.id, s);
    if (s.inReplyToId){ if (!S.children.has(s.inReplyToId)) S.children.set(s.inReplyToId, []); S.children.get(s.inReplyToId).push(s); }
    s._t = +new Date(s.published) || 0;
  }
  S.tag = null; S.q = ''; S.year = null;
  const st = {posts:0, replies:0, boosts:0, media:0, first:null, last:null, tags:new Map(), years:new Map(), vis:{public:0,unlisted:0,private:0,direct:0}};
  for (const s of d.statuses){
    if (s.kind === 'boost') st.boosts++; else if (s.inReplyTo && !s.inReplyToId) st.replies++; else st.posts++;
    st.media += s.attachments.length;
    st.vis[s.visibility] = (st.vis[s.visibility]||0) + 1;
    if (s._t){ if (!st.first || s._t < st.first) st.first = s._t; if (!st.last || s._t > st.last) st.last = s._t;
      const y = new Date(s._t).getFullYear(); st.years.set(y, (st.years.get(y)||0) + 1); }
    for (const t of s.tags) st.tags.set(t, (st.tags.get(t)||0) + 1);
  }
  S.stats = st;
  renderLeft(); renderRight(); renderBanner();
  $('#search-input').value = '';

}

/* ---------- filtering ---------- */
function textOf(s){
  if (s._text == null) s._text = (plain(s.content) + ' ' + plain(s.summary) + ' ' + (s.poll ? s.poll.options.map(o=>o.name).join(' ') : '') + ' ' + s.attachments.map(a=>a.alt).join(' ') + ' ' + (s.boostOf||'')).toLowerCase();
  return s._text;
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  let out = S.data.statuses.filter(s => {
    if (!S.vis[s.visibility]) return false;
    if (S.tab === 'posts' && s.kind === 'post' && s.inReplyTo && !s.inReplyToId) return false;
    if (S.group && !q && !S.tag && (S.tab === 'posts' || S.tab === 'replies') && s.inReplyToId && S.vis[(S.byId.get(s.inReplyToId)||{}).visibility]) return false;
    if (S.tab === 'media' && !s.attachments.some(a => a.type !== 'other')) return false;
    if (S.tag && !s.tags.includes(S.tag)) return false;
    if (S.year && new Date(s._t).getFullYear() !== S.year) return false;
    if (q && !q.split(/\s+/).every(w => textOf(s).includes(w))) return false;
    return true;
  });
  out.sort((a,b) => S.sort === 'new' ? b._t - a._t : a._t - b._t);
  return out;
}
function filteredLinks(){
  const q = S.q.trim().toLowerCase();
  let l = S.tab === 'likes' ? S.data.likes : S.data.bookmarks;
  if (q) l = l.filter(u => u.toLowerCase().includes(q));
  return S.sort === 'new' ? l : [...l].reverse();
}

function visBadge(v){ const x = VIS[v] || VIS.public; return `<span title="${x.label}" aria-label="${x.label}">${icon(x.icon)}</span>`; }
function gallery(s){
  const vis = s.attachments.filter(a => a.type === 'image' || a.type === 'video');
  let h = '';
  if (vis.length){
    const n = Math.min(vis.length, 4);
    let ratio = '';
    if (n === 1 && vis[0].w && vis[0].h){ const r = Math.max(.6, Math.min(2.2, vis[0].w / vis[0].h)); ratio = ` style="aspect-ratio:${r.toFixed(3)}"`; }
    h += `<div class="gallery n${n}${s.sensitive ? ' blur' : ''}"${ratio}>`;
    if (s.sensitive) h += `<button class="sens" data-act="unblur">민감한 콘텐츠<small>눌러서 보기</small></button>`;
    vis.slice(0,4).forEach((a, i) => {
      h += `<button class="gi" data-act="lightbox" data-sid="${esc(s.id)}" data-idx="${i}" aria-label="${esc(a.alt || (a.type === 'video' ? '동영상' : '이미지'))} 크게 보기">`;
      h += a.type === 'video' ? `<video muted playsinline preload="metadata" data-media="${esc(a.path)}"></video><span class="play">${icon('play')}</span>`
        : `<img loading="lazy" alt="${esc(a.alt)}" data-media="${esc(a.path)}">`;
      if (a.alt) h += '<span class="badge">ALT</span>';
      h += '</button>';
    });
    h += '</div>';
  }
  for (const a of s.attachments.filter(a => a.type === 'audio')) h += `<audio class="audio-att" controls preload="none" data-media="${esc(a.path)}" title="${esc(a.alt)}"></audio>`;
  for (const a of s.attachments.filter(a => a.type === 'other')) h += `<div class="file-att">${icon('file')}<span>${esc(a.path.split('/').pop())}</span></div>`;
  return h;
}
function pollHTML(p){
  const max = Math.max(...p.options.map(o => o.count), 0);
  let h = '<div class="poll">';
  for (const o of p.options){
    const pct = p.total ? Math.round(o.count / (p.multiple ? Math.max(p.voters,1) : p.total) * 100) : 0;
    h += `<div class="poll-opt${o.count === max && max > 0 ? ' lead' : ''}"><span class="fill" style="width:${pct}%"></span><span class="pct">${pct}%</span><span>${esc(o.name)}</span></div>`;
  }
  h += `<div class="poll-foot">${p.voters.toLocaleString('ko-KR')}명 투표 · ${p.closed ? '마감됨' : (p.endTime ? fmtFull(p.endTime) + ' 마감' : '진행 중')}${p.multiple ? ' · 복수 선택' : ''}</div></div>`;
  return h;
}
function shortUrl(u){ try { const x = new URL(u); return x.host + x.pathname; } catch(e){ return u; } }
function acctFromUrl(u){
  try { const x = new URL(u); let m = x.pathname.match(/^\/@([^/]+)/) || x.pathname.match(/^\/users\/([^/]+)/);
    return m ? `@${m[1]}@${x.host}` : x.host; } catch(e){ return u; }

const getStatus = id => S.byId.get(id) || (S.data.others && S.data.others[id]) || null;

function threadOf(id){
  const c = S.convOf.get(id);
  const anc = [], desc = [];
  if (c){
    const par = Object.assign({}, c.parent);
    for (const x of c.order){ const own = S.byId.get(x); if (own && own.inReplyToId && !par[x]) par[x] = own.inReplyToId; }
    let cur = par[id]; const seen = new Set([id]);
    while (cur && !seen.has(cur)){ seen.add(cur); const st = getStatus(cur); if (st) anc.unshift(st); cur = par[cur]; }
    const kids = new Map();
    for (const x of new Set([...c.order, ...S.byId.keys()].filter(k => par[k] || (S.byId.get(k)||{}).inReplyToId))){
      const p = par[x] || S.byId.get(x).inReplyToId; if (!kids.has(p)) kids.set(p, []); kids.get(p).push(x);
    }
    const done = new Set([id]);
    (function walk(p){ for (const k of (kids.get(p) || []).map(getStatus).filter(Boolean).sort((a,b) => a._t - b._t)){ if (done.has(k.id)) continue; done.add(k.id); desc.push(k); walk(k.id); } })(id);
  } else {
    let cur = S.byId.get(id);
    while (cur && cur.inReplyToId && S.byId.has(cur.inReplyToId) && anc.length < 500){ cur = S.byId.get(cur.inReplyToId); anc.unshift(cur); }
    (function walk(p, d){ for (const k of (S.children.get(p) || []).sort((a,b) => a._t - b._t)){ desc.push(k); if (d < 500) walk(k.id, d+1); } })(id, 0);
  }
  return {anc: anc.filter(shown), desc: desc.filter(shown)};
}
function threadSize(id){ const t = threadOf(id); return 1 + t.anc.length + t.desc.length; }
const emo = list => Object.fromEntries((list || []).map(e => [`:${e.shortcode}:`, e.url || e.static_url]));
function fromApi(st, key){
  const acc = st.account || {};
  let own = ''; try { own = new URL(S.data.actor.id).host; } catch(e){}
  const acct = acc.acct || acc.username || '';
  const vis = {public:'public', unlisted:'unlisted', private:'private', direct:'direct'}[st.visibility] || 'public';
  const mt = m => m.type === 'image' ? 'image' : (m.type === 'video' || m.type === 'gifv') ? 'video' : m.type === 'audio' ? 'audio' : 'other';
  const o = {
    id:key || String(st.id), kind:'post', foreign:true, url: st.url || st.uri || '', published: st.created_at,
    content: st.content || '', summary: st.spoiler_text || '', sensitive: !!st.sensitive, visibility: vis,
    inReplyTo: null, tags: (st.tags || []).map(t => String(t.name).toLowerCase()), emojis: emo(st.emojis), lang: st.language || '',
    attachments: (st.media_attachments || []).map(m => ({type: mt(m), path: m.url || m.remote_url || '', alt: m.description || '',
      w: (m.meta && m.meta.original && m.meta.original.width) || 0, h: (m.meta && m.meta.original && m.meta.original.height) || 0})).filter(a => a.path),
    poll: st.poll ? {options: (st.poll.options || []).map(x => ({name: x.title, count: x.votes_count || 0})), multiple: !!st.poll.multiple,
      voters: st.poll.voters_count ?? st.poll.votes_count ?? 0, total: st.poll.votes_count || 0, endTime: st.poll.expires_at, closed: !!st.poll.expired} : null,
    author: {name: acc.display_name || acc.username || acct, handle: '@' + (acct.includes('@') ? acct : acct + (own ? '@' + own : '')),
      avatar: acc.avatar_static || acc.avatar || '', url: acc.url || '', emojis: emo(acc.emojis)}
  };
  o._t = +new Date(o.published) || 0;
  return o;
}

function statusHTML(s, opt={}){
  const A = s.author || S.data.actor;
  const cls = ['status']; if (opt.focused) cls.push('focused'); if (opt.hasNext) cls.push('has-next'); if (opt.hasPrev) cls.push('has-prev');
  const href = s.foreign ? esc(s.url) + '" target="_blank" rel="noopener noreferrer' : '#post-' + esc(s.id);
  const time = `<div class="st-time"><a href="${href}" title="${esc(fmtFull(s.published))}"><time datetime="${esc(s.published)}">${esc(relTime(s.published))}</time></a>${visBadge(s.visibility)}</div>`;
  const head = `<div class="st-head"><img class="st-avatar" alt="" data-media="${esc(A.avatar || '')}"><div class="st-names"><bdi class="dn">${sanitize(esc(A.name), A.emojis)}</bdi><span class="acct">${esc(A.handle)}</span></div>${opt.focused ? '' : time}</div>`;
  if (s.kind === 'boost'){
    return `<article class="${cls.join(' ')}" data-id="${esc(s.id)}" data-kind="boost"><div class="prepend">${icon('boost')}<span>${sanitize(esc(A.name), A.emojis)}님이 부스트했습니다</span></div>
      ${head}<div class="boost-card"><span class="bi">${icon('boost')}</span><div><a href="${esc(s.boostOf)}" target="_blank" rel="noopener noreferrer">${esc(acctFromUrl(s.boostOf))} 님의 게시물 ${icon('ext')}</a><p>아카이브에는 부스트한 글의 본문이 들어 있지 않아 원래 주소로 연결해요.</p></div></div></article>`;
  }
  let body = '';
  if (opt.hasPrev) {}
  else if (s.inReplyTo && !s.inReplyToId) body += `<div class="reply-to">${icon('reply')}<span>답글:</span><a href="${esc(s.inReplyTo)}" target="_blank" rel="noopener noreferrer">${esc(acctFromUrl(s.inReplyTo))}</a></div>`;
  else if (s.inReplyToId) body += `<div class="reply-to">${icon('reply')}<a href="#post-${esc(s.inReplyToId)}">내 게시물에 이어서 쓴 글</a></div>`;
  const inner = `<div class="content" lang="${esc(s.lang||'')}">${sanitize(s.content, s.emojis)}</div>${s.poll ? pollHTML(s.poll) : ''}${gallery(s)}`;
  if (s.summary) body += `<div class="cw"><p>${sanitize(esc(s.summary), s.emojis)}</p><button class="cw-btn" data-act="cw" aria-expanded="false">더 보기</button></div><div class="cw-body" hidden style="display:flex;flex-direction:column;gap:10px">${inner}</div>`;
  else body += inner;
  let foot;
  if (opt.focused){
    foot = `<div class="focus-meta"><time datetime="${esc(s.published)}">${esc(fmtFull(s.published))}</time><span>·</span>${visBadge(s.visibility)}<span>${esc((VIS[s.visibility]||VIS.public).label)}</span>${s.url ? `<span>·</span><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">원래 주소 ${icon('ext')}</a>` : ''}${(!EMBED && !s.foreign) ? `<span>·</span><button class="linkbtn" data-act="fetchctx" data-id="${esc(s.id)}">${S.convOf.has(s.id) ? '대화 다시 불러오기' : '다른 사람 글까지 불러오기'}</button>` : ''}</div><p class="small" id="ctx-status" role="status"></p>`;
  } else {
    const canBoost = s.visibility === 'public' || s.visibility === 'unlisted';
    const n = (!opt.inThread && !opt.hasPrev && !opt.hasNext) ? threadSize(s.id) : 1;
    if (n > 1) body += `<button class="thread-btn" data-act="thread" data-id="${esc(s.id)}">${icon('replies')}타래 이어보기 · ${n}개</button>`;
    foot = `<div class="actions" aria-hidden="true"><span>${icon('reply')}${(S.children.get(s.id)||[]).length || ''}</span><span class="${canBoost ? '' : 'off'}">${icon(canBoost ? 'boost' : 'lock')}</span><span>${icon('star')}</span><span>${icon('bookmark')}</span><span>${icon('more')}</span></div>`;
  }
  return `<article class="${cls.join(' ')}" data-id="${esc(s.id)}"${s.foreign ? ' data-foreign="1"' : ''}>${head}${body}${foot}</article>`;
}

function renderMore(){
  const feed = $('#feed'), step = S.tab === 'media' ? 60 : 30;

  const tmp = document.createElement('div');
  if (S.tab === 'media') tmp.innerHTML = slice.map(({s, a, i}) => `<button class="gi" data-act="lightbox" data-sid="${esc(s.id)}" data-idx="${i}" aria-label="${esc(a.alt || '미디어')} 크게 보기">${a.type === 'video' ? `<video muted playsinline preload="metadata" data-media="${esc(a.path)}"></video><span class="play">${icon('play')}</span>` : `<img loading="lazy" alt="${esc(a.alt)}" data-media="${esc(a.path)}">`}</button>`).join('');
  else if (S.tab === 'likes' || S.tab === 'bookmarks') tmp.innerHTML = slice.map(u => `<a class="linkcard" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span class="bi">${icon(S.tab === 'likes' ? 'star' : 'bookmark')}</span><div><b>${esc(acctFromUrl(u))}</b><span>${esc(shortUrl(u))}</span></div></a>`).join('');

  $('#sentinel').textContent = S.shown < S.list.length ? `${S.shown.toLocaleString('ko-KR')} / ${S.list.length.toLocaleString('ko-KR')} 불러옴` : '';
}

function openPost(id){
  const s = getStatus(id);
  const dv = $('#detail-view');
  if (!s){ dv.innerHTML = `<div class="col-head"><button data-act="back">${icon('back')}뒤로</button></div><div class="empty">이 아카이브에서 게시물을 찾지 못했어요.</div>`; return; }
  const {anc, desc} = threadOf(s.id);
  let h = `<div class="col-head"><button data-act="back">${icon('back')}뒤로</button><span>게시물</span>${panelBtn()}</div>`;
  anc.forEach((a, i) => h += statusHTML(a, {hasNext:true, hasPrev:i > 0, inThread:true}));
  h += statusHTML(s, {focused:true, hasPrev:anc.length > 0, hasNext:desc.length > 0, inThread:true});
  desc.forEach((d, i) => h += statusHTML(d, {hasPrev:true, hasNext:i < desc.length - 1, inThread:true}));
  dv.innerHTML = h;
  hydrate(dv);
}

function route(fresh){
  const h = decodeURIComponent(location.hash.slice(1));
  const lv = $('#list-view'), dv = $('#detail-view');
  if (h.startsWith('post-')){
    if (!lv.hidden) S.listScroll = window.scrollY;
    lv.hidden = true; dv.hidden = false;
    openPost(h.slice(5));
    window.scrollTo(0, 0);
    const f = dv.querySelector('.focused'); if (f && f.previousElementSibling && f.previousElementSibling.classList.contains('status')) f.scrollIntoView({block:'start'});
    return;
  }
  const tab = TABS.some(t => t.id === h) ? h : 'posts';
  const changed = tab !== S.tab || fresh;
  S.tab = tab;
  dv.hidden = true; dv.innerHTML = '';
  const wasHidden = lv.hidden;
  lv.hidden = false;
  if (fresh) renderProfile();
  renderTabs();
  if (changed || !$('#feed').childElementCount) refreshList();
  if (wasHidden && !changed) window.scrollTo(0, S.listScroll);
}

/* ---------- fetch conversations from the instance API ---------- */
const API = {token:'', running:false, stop:false};
const sleep = ms => new Promise(r => setTimeout(r, ms));
function ownOrigin(){ try { return new URL(S.data.actor.id).origin; } catch(e){ return ''; } }
async function apiGet(path, onWait){
  const headers = {Accept:'application/json'};
  if (API.token) headers.Authorization = 'Bearer ' + API.token;
  for (let attempt = 0; attempt < 5; attempt++){
    let r;
    try { r = await fetch(ownOrigin() + path, {headers, credentials:'omit'}); }
    catch(e){ const err = new Error(window.self !== window.top ? '미리보기 화면에서는 다른 서버에 접속할 수 없어요. 받은 HTML 파일을 내 컴퓨터에서 열어 주세요.' : `${ownOrigin().replace(/^https?:\/\//,'')}에 연결하지 못했어요. 인스턴스가 닫혔거나 인터넷 연결에 문제가 있을 수 있어요.`); err.fatal = true; throw err; }
    if (r.status === 429){
      const reset = r.headers.get('X-RateLimit-Reset');
      const wait = Math.min(300000, Math.max(5000, reset ? new Date(reset) - Date.now() + 1000 : 60000));
      if (onWait) onWait(wait); await sleep(wait); continue;
    }
    if (r.status === 404 || r.status === 410) return null;
    if (r.status === 401 || r.status === 403){ const err = new Error(API.token ? '토큰이 맞지 않거나 권한이 부족해요. read:statuses 권한이 있는 토큰인지 확인해 주세요.' : '이 인스턴스는 로그인 없이 글을 불러올 수 없게 되어 있어요. 아래에 액세스 토큰을 넣고 다시 시도해 주세요.'); err.fatal = true; throw err; }
    if (!r.ok){ if (attempt < 2){ await sleep(3000); continue; } throw new Error('서버 오류 (' + r.status + ')'); }
    return r.json();
  }
  throw new Error('요청이 너무 많다고 해요. 잠시 뒤 다시 시도해 주세요.');
}
function mergeConvo(order, parent){
  const hits = new Set(order.map(x => S.convOf.get(x)).filter(Boolean));
  const m = {order:[], parent:{}};
  for (const c of hits){ m.order.push(...c.order); Object.assign(m.parent, c.parent); }
  m.order = [...new Set([...m.order, ...order])]; Object.assign(m.parent, parent);
  S.data.convos = S.data.convos.filter(c => !hits.has(c)); S.data.convos.push(m);
  for (const x of m.order) S.convOf.set(x, m);
}
async function resolveApiId(local, onWait){
  if (S.apiId.has(local)) return S.apiId.get(local);
  const s = S.byId.get(local);
  if (/^\d+$/.test(local) && !(S.noNumeric && S.noNumeric.has(local))) return local;
  const q = s && (s.uri || s.url); if (!q) return null;
  const r = await apiGet(`/api/v2/search?q=${encodeURIComponent(q)}&type=statuses&resolve=true&limit=1`, onWait);
  const hit = r && r.statuses && r.statuses[0];
  if (!hit) return null;
  S.apiId.set(local, String(hit.id)); return String(hit.id);
}
async function fetchContext(id, onWait){
  const apiId = await resolveApiId(id, onWait);
  if (!apiId){ const e = new Error('서버에서 이 글을 찾지 못했어요 (지워졌거나 주소가 달라졌을 수 있어요).'); e.notFound = true; throw e; }
  let ctx = await apiGet(`/api/v1/statuses/${encodeURIComponent(apiId)}/context`, onWait);
  if (!ctx && apiId === id && !S.apiId.has(id)){
    (S.noNumeric = S.noNumeric || new Set()).add(id);
    return fetchContext(id, onWait);
  }
  if (!ctx) return 0;
  const all = [...(ctx.ancestors || []), ...(ctx.descendants || [])];
  const key = new Map([[String(apiId), id]]);
  for (const st of all){
    const own = st.uri && S.byUri.get(String(st.uri).replace(/\/+$/, '')) || st.url && S.byUri.get(String(st.url).replace(/\/+$/, ''));
    key.set(String(st.id), own || 'r' + st.id);
    if (own) S.apiId.set(own, String(st.id));
  }
  const K = x => key.get(String(x)) || 'r' + x;
  const order = [...(ctx.ancestors || []).map(x => K(x.id)), id, ...(ctx.descendants || []).map(x => K(x.id))];
  const parent = {}; let foreign = 0;
  for (const st of all){
    const k = K(st.id);
    if (st.in_reply_to_id) parent[k] = K(st.in_reply_to_id);
    if (!S.byId.has(k)){ if (!S.data.others[k]) foreign++; S.data.others[k] = fromApi(st, k); }
  }
  if (ctx.ancestors && ctx.ancestors.length) parent[id] = K(ctx.ancestors[ctx.ancestors.length - 1].id);
  mergeConvo(order, parent);
  return foreign;
}

async function fetchAll(){
  if (API.running){ API.stop = true; return; }
  readToken();
  const scope = $('#api-scope').value, prog = $('#api-progress'), btn = $('#api-go');
  const roots = (s) => !s.inReplyToId;
  let cand = S.data.statuses.filter(s => s.kind === 'post' && !S.convOf.has(s.id)
    && (scope === 'all' || s.inReplyTo || S.children.has(s.id))
    && (API.token || s.visibility === 'public' || s.visibility === 'unlisted'));
  const skipped = API.token ? 0 : S.data.statuses.filter(s => s.kind === 'post' && (s.visibility === 'private' || s.visibility === 'direct') && (scope === 'all' || s.inReplyTo || S.children.has(s.id))).length;
  cand.sort((a,b) => (roots(b) - roots(a)) || (a._t - b._t));
  if (!cand.length){ prog.className = 'small'; prog.textContent = '새로 불러올 게시물이 없어요.' + (skipped ? ` 비공개 글 ${skipped}개는 토큰이 있어야 불러올 수 있어요.` : ''); return; }
  API.running = true; API.stop = false; btn.textContent = '멈추기'; prog.className = 'small';
  let done = 0, got = 0, err = null, fails = 0, lastErr = '';
  const t0 = Date.now();
  for (const s of cand){
    if (API.stop) break;
    if (S.convOf.has(s.id)){ done++; continue; }
    const left = cand.length - done;
    prog.textContent = `${done.toLocaleString('ko-KR')} / ${cand.length.toLocaleString('ko-KR')} 확인 · 다른 사람 글 ${got.toLocaleString('ko-KR')}개 · 남은 시간 약 ${Math.max(1, Math.ceil(left * 1.15 / 60))}분`;
    try { got += await fetchContext(s.id, w => { prog.textContent = `요청 한도에 걸려 ${Math.ceil(w/1000)}초 기다리는 중… (${done} / ${cand.length})`; }); }
    catch(e){ if (e.fatal){ err = e; break; } fails++; lastErr = e.message; if (done === 0 && fails >= 3 && cand.length > 5){ err = new Error('처음 몇 개가 모두 실패했어요: ' + lastErr + ' [문제 진단]을 눌러 확인해 주세요.'); break; } }
    done++;
    await sleep(1100);
  }
  API.running = false; btn.textContent = '대화 불러오기 시작';
  const mins = Math.round((Date.now() - t0) / 60000);
  if (err){ prog.className = 'err'; prog.textContent = err.message + (got ? ` (그 전까지 다른 사람 글 ${got}개는 불러왔어요.)` : ''); }
  else prog.textContent = `${API.stop ? '멈췄어요. ' : '다 불러왔어요. '}게시물 ${done.toLocaleString('ko-KR')}개를 확인해서 다른 사람 글 ${got.toLocaleString('ko-KR')}개를 가져왔어요${mins ? ` (${mins}분)` : ''}. 내보내기를 하면 함께 저장돼요.` + (skipped ? ` 비공개 글 ${skipped}개는 토큰이 없어서 건너뛰었어요.` : '') + (fails ? ` ${fails}개는 실패했어요 (${lastErr}).` : '');
  renderLeft(); refreshList();
}

async function diagnose(){
  const box = $('#diag-text'); $('#diag-modal').hidden = false; box.value = '확인하는 중이에요…';
  readToken();
  const d = S.data, L = [];
  const posts = d.statuses.filter(x => x.kind === 'post');
  const replies = posts.filter(x => x.inReplyTo);
  const selfR = posts.filter(x => x.inReplyToId);
  const host = (() => { try { return new URL(d.actor.id).host; } catch(e){ return '?'; } })();
  const sameHost = replies.filter(x => { try { return new URL(x.inReplyTo).host === host; } catch(e){ return false; } });
  L.push(`뷰어 버전: 3`, `계정 주소: ${d.actor.id}`, `게시물 ${posts.length} / 부스트 ${d.statuses.length - posts.length}`);
  L.push(`답글 ${replies.length}개 중 내 서버 글에 단 답글 ${sameHost.length}개, 그중 내 글로 연결된 것 ${selfR.length}개`);
  L.push(`글 ID 예시: ${posts.slice(0,3).map(x => x.uri).join('  ')}`);
  L.push(`글 주소 예시: ${posts.slice(0,2).map(x => x.url).join('  ')}`);
  const un = sameHost.filter(x => !x.inReplyToId).slice(0,3).map(x => x.inReplyTo);
  if (un.length) L.push(`연결 안 된 답글 대상 예시: ${un.join('  ')}`);
  L.push(`공개 범위: ${Object.entries(S.stats.vis).map(([k,v]) => k + ' ' + v).join(', ')}`);
  L.push(`토큰 입력: ${API.token ? '있음' : '없음'}`);
  try {
    const inst = await apiGet('/api/v1/instance');
    L.push(`서버 응답: ${inst ? (inst.uri || inst.domain || '') + ' · ' + (inst.version || '버전 정보 없음') : '없음'}`);
  } catch(e){ L.push('서버 연결 실패: ' + e.message); }
  const test = replies[0] || posts[0];
  if (test){
    try { const id = await resolveApiId(test.id); L.push(`글 찾기 테스트: 아카이브 ID ${test.id} → 서버 ID ${id || '찾지 못함'}`);
      if (id){ const c = await apiGet(`/api/v1/statuses/${id}/context`); L.push(`대화 테스트: ${c ? `앞 ${c.ancestors.length}개 / 뒤 ${c.descendants.length}개` : '없음(404)'}`); } }
    catch(e){ L.push('글 찾기 테스트 실패: ' + e.message); }
  }
  box.value = L.join('\n');
}

function setStatus(msg, err){ const el = $('#load-status'); el.className = err ? 'err' : 'small'; el.textContent = msg || ''; }
async function loadInput(files){
  try {
    setStatus('아카이브를 여는 중이에요…');
    let vfs;
    if (files.length > 1 || (files[0] && files[0].webkitRelativePath)) vfs = vfsFromFiles(files);
    else {
      const f = files[0], n = f.name.toLowerCase();
      if (/\.(tar\.gz|tgz)$/.test(n)) vfs = await vfsFromTar(f, true);
      else if (/\.tar$/.test(n)) vfs = await vfsFromTar(f, false);
      else if (/\.json$/.test(n)) vfs = vfsFromFiles(files);
      else vfs = await vfsFromZip(f);
    }
    setStatus('게시물을 읽는 중이에요…');
    const j = async p => { const t = await vfs.text(p); if (t == null) return null; try { return JSON.parse(t); } catch(e){ return null; } };
    const outbox = await j('outbox.json');
    if (!outbox) throw new Error('outbox.json을 읽지 못했어요. 파일이 손상되었을 수 있어요.');
    const data = normalize(await j('actor.json'), outbox, await j('likes.json'), await j('bookmarks.json'));
    if (VFS) VFS.revoke();
    VFS = vfs;
    S.vis = {public:true, unlisted:true, private:true, direct:false};
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    setData(data);
    setStatus(`게시물 ${data.statuses.length.toLocaleString('ko-KR')}개를 불러왔어요.`);
    window.scrollTo(0, 0);
  } catch(e){
    console.error(e);
    setStatus(e && e.message ? e.message : '아카이브를 열지 못했어요.', true);
  }
}

function safeJSON(o){ return JSON.stringify(o).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029'); }
function buildExportHTML(payload){
  const css = $('#mav-css').textContent, js = $('#mav-js').textContent;
  const A = payload.actor;
  return `<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">

<script>window.__MAV_EMBED__=${safeJSON(payload)};<\/script>
<script id="mav-js">${js}<\/script>
</body></html>`;
}
function exportPayload(){
  const vis = {}; document.querySelectorAll('#export-modal [data-exvis]').forEach(c => vis[c.dataset.exvis] = c.checked);
  const withLinks = $('#ex-links').checked;
  const statuses = S.data.statuses.filter(s => vis[s.visibility]).map(s => { const c = Object.assign({}, s); delete c._t; delete c._text; return c; });
  const others = {}, convos = [];
  if ($('#ex-others').checked){
    for (const [k, o] of Object.entries(S.data.others)) if (vis[o.visibility]){ const c = Object.assign({}, o); delete c._t; delete c._text; others[k] = JSON.parse(JSON.stringify(c)); }
    for (const c of S.data.convos) convos.push({order:c.order, parent:c.parent});
  }
  return {actor:S.data.actor, statuses, others, convos, likes:withLinks ? S.data.likes : [], bookmarks:withLinks ? S.data.bookmarks : [], exportedAt:new Date().toISOString()};
}
function saveBlob(blob, name){
  const u = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 120000);
}
async function doExport(htmlOnly){
  const prog = $('#ex-progress'), go = $('#ex-go'), go2 = $('#ex-html');
  go.disabled = go2.disabled = true;
  try {
    const payload = exportPayload();
    const base = 'mastodon-archive-' + (S.data.actor.username || 'export');
    if (htmlOnly){ const html = buildExportHTML(payload); saveBlob(new Blob([html], {type:'text/html'}), 'index.html'); prog.textContent = 'index.html을 저장했어요.'; return; }
    if (typeof zip === 'undefined') throw new Error('zip 라이브러리를 불러오지 못했어요.');
    zip.configure({useWebWorkers:false});
    const paths = new Set();
    const add = p => { if (p && !/^(data:|blob:|https?:)/i.test(p)) paths.add(p); };
    add(payload.actor.avatar); add(payload.actor.header);
    for (const s of payload.statuses){ s.attachments.forEach(a => add(a.path)); Object.values(s.emojis || {}).forEach(add); }
    Object.values(payload.actor.emojis || {}).forEach(add);
    const w = new zip.ZipWriter(new zip.BlobWriter('application/zip'));
    let remoteOk = 0, remoteFail = 0;
    if ($('#ex-remote').checked && Object.keys(payload.others).length){
      const map = new Map(), refs = [];
      const want = (obj, key) => { const u = obj[key]; if (u && /^https?:/i.test(u)){ refs.push([obj, key]); if (!map.has(u)) map.set(u, null); } };
      for (const o of Object.values(payload.others)){
        want(o.author, 'avatar'); o.attachments.forEach(a => want(a, 'path'));
        for (const k of Object.keys(o.emojis || {})) want(o.emojis, k);
        for (const k of Object.keys(o.author.emojis || {})) want(o.author.emojis, k);
      }
      let i = 0;
      for (const u of map.keys()){
        i++; prog.textContent = `다른 사람 이미지 받는 중… ${i.toLocaleString('ko-KR')} / ${map.size.toLocaleString('ko-KR')}`;
        try {
          const r = await fetch(u, {mode:'cors', credentials:'omit'}); if (!r.ok) throw 0;
          const b = await r.blob(); const x = new URL(u);
          const local = ('remote/' + x.host + x.pathname).replace(/\/+/g, '/');
          await w.add(local, new zip.BlobReader(b), {level:0}); map.set(u, local); remoteOk++;
        } catch(e){ remoteFail++; }
      }
      for (const [obj, key] of refs){ const l = map.get(obj[key]); if (l) obj[key] = l; }
    }
    const html = buildExportHTML(payload);
    await w.add('index.html', new zip.TextReader(html));
    let i = 0, miss = 0;
    for (const p of paths){
      i++; if (i % 10 === 0 || i === paths.size) prog.textContent = `미디어 담는 중… ${i.toLocaleString('ko-KR')} / ${paths.size.toLocaleString('ko-KR')}`;
      const k = VFS && VFS.find(p);
      if (!k){ miss++; continue; }
      await w.add(p.replace(/^\/+/, ''), new zip.BlobReader(await VFS.blob(k)), {level:0});
    }
    prog.textContent = 'zip 파일을 마무리하는 중…';
    const out = await w.close();
    saveBlob(out, base + '.zip');
    prog.textContent = `${base}.zip을 저장했어요 (게시물 ${payload.statuses.length.toLocaleString('ko-KR')}개, 미디어 ${(paths.size - miss).toLocaleString('ko-KR')}개).` + (miss ? ` 아카이브에 없는 미디어 ${miss}개는 빠졌어요.` : '') + (remoteOk || remoteFail ? ` 다른 사람 이미지 ${remoteOk}개를 담았어요.` + (remoteFail ? ` ${remoteFail}개는 서버가 막아서 원래 주소로 남겼어요.` : '') : '');
  } catch(e){ console.error(e); prog.textContent = '내보내지 못했어요: ' + (e.message || e); }
  finally { go.disabled = go2.disabled = false; }
}

      <details style="margin-top:10px"><summary class="small" style="cursor:pointer">비공개 글도 불러오기 (액세스 토큰)</summary>
        <p class="small" style="margin:8px 0">인스턴스의 환경설정 → 개발 → 새 애플리케이션에서 <b>read:statuses</b> 권한으로 만든 액세스 토큰을 넣으세요. 이 페이지가 열려 있는 동안만 쓰이고 어디에도 저장되지 않아요. <button class="linkbtn" data-act="help" data-sec="h-token">토큰 만드는 법</button></p>
        <input id="api-token" type="password" autocomplete="off" placeholder="액세스 토큰" style="width:100%;background:var(--col);border:1px solid var(--line);border-radius:6px;padding:8px 10px"></details>
      <button class="btn block" id="api-go" data-act="fetchall" style="margin-top:10px">대화 불러오기 시작</button>
      <p class="small" id="api-progress" role="status" aria-live="polite" style="margin-top:8px"></p>
      <p class="small" id="api-count"></p>
      <button class="linkbtn" data-act="diagnose" style="margin-top:6px">문제 진단</button></section>`}
    <section class="panel collapsible"><h3>요약</h3><dl class="stats" id="stats"></dl><div class="years" id="years"></div></section>
    <section class="panel collapsible"><h3>자주 쓴 해시태그</h3><div class="chips" id="tagcloud"></div></section>
    ${EMBED ? `<p class="small collapsible" style="padding:0 4px">${esc(fmtDay(EMBED.exportedAt))}에 만든 아카이브예요.</p>` : ''}
  </aside>
  <main class="column" id="center">
    <div class="banner" id="banner" hidden></div>
    <div id="list-view">
      <div class="col-head">${icon('posts')}<span>프로필</span>${panelBtn()}</div>
      <div id="profile"></div>
      <nav class="tabs" id="tabs" aria-label="게시물 종류"></nav>
      <div class="filter-note" id="filter-note" hidden></div>
      <div id="feed"></div>
      <div class="loadmore" id="sentinel"></div>
    </div>
    <div id="detail-view" hidden></div>
  </main>
  <aside class="side side-right"><nav class="nav" id="nav" aria-label="탐색"></nav></aside>
</div>
<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="미디어 보기">
  <div class="lb-stage"></div><div class="lb-cap"></div>
  <button class="lb-btn lb-close" data-act="lbclose" aria-label="닫기">${icon('close')}</button>
  <button class="lb-btn lb-prev" data-act="lbprev" aria-label="이전">${icon('left')}</button>
  <button class="lb-btn lb-next" data-act="lbnext" aria-label="다음">${icon('right')}</button>
</div>
<div class="modal" id="export-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ex-title">
  <div class="modal-card"><h2 id="ex-title">HTML로 내보내기</h2>
    <p>지금 보는 화면 그대로 index.html과 미디어 파일을 zip 하나에 담아요. 압축을 풀고 index.html을 열면 인터넷 연결 없이도 볼 수 있고, 웹 호스팅에 그대로 올려도 돼요.</p>
    <fieldset><legend>포함할 공개 범위</legend>${Object.entries(VIS).map(([k, v]) => `<label><input type="checkbox" id="ex-vis-${k}" data-exvis="${k}" ${k === 'direct' ? '' : 'checked'}>${icon(v.icon)}${v.label}</label>`).join('')}</fieldset>
    <label><input type="checkbox" id="ex-links" checked>좋아요·북마크 목록 포함</label>
    <label><input type="checkbox" id="ex-others" checked>불러온 다른 사람 글 포함</label>
    <label><input type="checkbox" id="ex-remote" checked>다른 사람 글의 프로필 사진·이미지도 zip에 담기</label>
    <p class="note" id="ex-frame-note" hidden>미리보기 화면 안에서는 파일 저장이 막혀 있어요. 받은 HTML 파일을 내 컴퓨터에서 브라우저로 열어 내보내 주세요.</p>
    <p class="note">공개 사이트로 올릴 때는 팔로워 전용·개인적인 멘션을 빼는 걸 권해요.</p>
    <div class="progress" id="ex-progress" role="status" aria-live="polite"></div>
    <div class="acts"><button class="btn ghost" data-act="exclose">닫기</button><button class="btn ghost" id="ex-html" title="압축을 푼 아카이브 폴더 안에 넣어서 쓰는 파일">index.html만 받기</button><button class="btn" id="ex-go">${icon('download')}zip 만들기</button></div>
  </div>
</div>
${EMBED ? '' : `<div class="modal" id="help-modal" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
  <div class="modal-card help"><div class="help-head"><h2 id="help-title">사용 설명서</h2><button class="btn ghost" data-act="helpclose">닫기</button></div><div class="help-body" id="help-body"></div></div>
</div>`}
<div class="modal" id="diag-modal" hidden role="dialog" aria-modal="true" aria-labelledby="diag-title">
  <div class="modal-card"><h2 id="diag-title">문제 진단</h2>
    <p>아카이브 구조와 서버 응답을 확인한 결과예요. 글 내용은 들어 있지 않아요. 잘 안 되면 이 내용을 복사해서 알려 주세요.</p>
    <textarea id="diag-text" readonly rows="12" style="width:100%;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical"></textarea>
    <div class="acts"><button class="btn ghost" data-act="diagclose">닫기</button><button class="btn" data-act="diagcopy">복사</button></div>
  </div>
</div>
${EMBED ? '' : `<input type="file" id="f-zip" accept=".zip,.gz,.tgz,.tar,application/zip,application/gzip" hidden>
<input type="file" id="f-dir" webkitdirectory multiple hidden>`}`;
  document.body.append(root);
}

function bind(){
  document.addEventListener('click', e => {
    const hl = e.target.closest('[data-help]');
    if (hl){ e.preventDefault(); const sec = document.getElementById(hl.dataset.help); if (sec) sec.scrollIntoView({block:'start'}); return; }
    const t = e.target.closest('[data-act],[data-vis],[data-year],[data-tag],a.hashtag,a[rel~="tag"]');
    if (t){
      const act = t.dataset.act;
      if (t.matches('a.hashtag, a[rel~="tag"]') && !act){
        e.preventDefault(); e.stopPropagation();
        S.tag = (t.textContent || '').replace(/^#/, '').trim().toLowerCase();
        if (location.hash.startsWith('#post-') || S.tab === 'likes' || S.tab === 'bookmarks' || S.tab === 'media') location.hash = 'posts';
        refreshList(); window.scrollTo(0, 0); return;
      }
      if (t.dataset.vis){ S.vis[t.dataset.vis] = !S.vis[t.dataset.vis]; t.setAttribute('aria-pressed', S.vis[t.dataset.vis]); refreshList(); return; }
      if (t.dataset.year){ const y = +t.dataset.year; S.year = S.year === y ? null : y; renderLeft(); if (location.hash.startsWith('#post-')) location.hash = S.tab; refreshList(); return; }
      if (t.dataset.tag){ S.tag = S.tag === t.dataset.tag ? null : t.dataset.tag; if (location.hash.startsWith('#post-') || S.tab === 'likes' || S.tab === 'bookmarks') location.hash = 'posts'; refreshList(); window.scrollTo(0,0); return; }
      switch (act){
        case 'open': $('#f-zip') && $('#f-zip').click(); return;
        case 'open-dir': $('#f-dir') && $('#f-dir').click(); return;
        case 'cw': { const b = t.closest('.status').querySelector('.cw-body'); b.hidden = !b.hidden; t.textContent = b.hidden ? '더 보기' : '접기'; t.setAttribute('aria-expanded', !b.hidden); e.stopPropagation(); return; }
        case 'unblur': t.parentElement.classList.remove('blur'); t.remove(); e.stopPropagation(); return;
        case 'lightbox': e.stopPropagation(); openLightbox(t.dataset.sid, +t.dataset.idx); return;
        case 'lbclose': closeLB(); return;
        case 'lbprev': LB.i = (LB.i - 1 + LB.items.length) % LB.items.length; showLB(); return;
        case 'lbnext': LB.i = (LB.i + 1) % LB.items.length; showLB(); return;
        case 'lbpost': closeLB(); return;
        case 'back': location.hash = S.tab; return;
        case 'clear': S.tag = null; S.year = null; S.q = ''; $('#search-input').value = ''; renderLeft(); refreshList(); return;
        case 'showall': for (const k in S.vis) S.vis[k] = true; renderLeft(); refreshList(); return;
        case 'thread': e.stopPropagation(); expandThread(t.closest('.status'), t.dataset.id); return;
        case 'unthread': collapseThread(t.closest('.thread-block')); return;
        case 'group': S.group = !S.group; t.setAttribute('aria-pressed', S.group); refreshList(); return;
        case 'fetchctx': fetchOne(t.dataset.id, t); return;
        case 'fetchall': fetchAll(); return;
        case 'diagnose': diagnose(); return;
        case 'help': openHelp(t.dataset.sec); return;
        case 'helpclose': $('#help-modal').hidden = true; return;
        case 'diagclose': $('#diag-modal').hidden = true; return;
        case 'diagcopy': { const ta = $('#diag-text'); const done = () => { t.textContent = '복사했어요'; setTimeout(() => t.textContent = '복사', 1500); };
          try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); }); } catch(err){ ta.select(); } return; }
        case 'toggle-left': setLeftHidden(!leftHidden()); return;
        case 'toggle-side': { const l = $('#left'); l.classList.toggle('collapsed'); t.setAttribute('aria-expanded', !l.classList.contains('collapsed')); return; }
        case 'export': if (t.disabled) return; $('#export-modal').hidden = false; $('#ex-progress').textContent = ''; $('#ex-frame-note').hidden = window.self === window.top; return;
        case 'exclose': $('#export-modal').hidden = true; return;
      }
      return;
    }
    const st = e.target.closest('.status[data-id]:not(.focused):not([data-foreign])');
    if (st && !e.target.closest('a,button,video,audio,.gallery') && !window.getSelection().toString()){
      if (st.dataset.kind === 'boost') return;
      location.hash = 'post-' + st.dataset.id;
    }
  });
  $('#lb').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.classList.contains('lb-stage')) closeLB(); });
  if ($('#help-modal')) $('#help-modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  $('#export-modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  document.addEventListener('keydown', e => {
    if (!$('#lb').hidden){
      if (e.key === 'Escape') closeLB();
      else if (e.key === 'ArrowLeft' && LB.items.length > 1){ LB.i = (LB.i - 1 + LB.items.length) % LB.items.length; showLB(); }
      else if (e.key === 'ArrowRight' && LB.items.length > 1){ LB.i = (LB.i + 1) % LB.items.length; showLB(); }
    } else if (e.key === 'Escape'){ for (const id of ['#export-modal', '#help-modal', '#diag-modal']){ const m = $(id); if (m) m.hidden = true; } }
  });
  $('#ex-go').addEventListener('click', () => doExport(false));
  $('#ex-html').addEventListener('click', () => doExport(true));
  let timer;
  $('#search-input').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => { S.q = e.target.value; if (location.hash.startsWith('#post-')) location.hash = S.tab; if (S.tab === 'media' && !S.q) {} refreshList(); }, 220);
  });
  $('#sort').addEventListener('change', e => { S.sort = e.target.value; refreshList(); });
  window.addEventListener('hashchange', () => route(false));
  io = new IntersectionObserver(en => { if (en[0].isIntersecting && !$('#list-view').hidden) renderMore(); }, {rootMargin:'800px'});
  io.observe($('#sentinel'));
  if (!EMBED){
    $('#f-zip').addEventListener('change', e => { if (e.target.files.length) loadInput(e.target.files); e.target.value = ''; });
    $('#f-dir').addEventListener('change', e => { if (e.target.files.length) loadInput(e.target.files); e.target.value = ''; });
    let depth = 0; const ov = $('#drop-ov'), dz = $('#dropzone');
    const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; ov.hidden = false; dz.classList.add('over'); });
    window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth){ ov.hidden = true; dz.classList.remove('over'); } });
    window.addEventListener('drop', e => {
      if (!hasFiles(e)) return; e.preventDefault(); depth = 0; ov.hidden = true; dz.classList.remove('over');
      if (e.dataTransfer.files.length) loadInput(e.dataTransfer.files);
    });
  }
}

try { if (localStorage.getItem('mav-left-hidden') === '1') document.body.classList.add('left-hidden'); } catch(e){}
buildShell();
bind();
setData(EMBED || buildSample());
})();
</script>
